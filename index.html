<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arij – Formatrice IA</title>
<style>
:root{--bg:#fff1f3;--fg:#2a1020;--card:#fff;--acc:#e8004f;--mut:#7a5a66;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a0f1a;--fg:#ffe9ef;--card:#3a1626;--acc:#ff4d85;--mut:#d9a9ba}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:480px;margin:0 auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:10px}
h1{font-size:18px;margin:4px 0 0;text-align:center}
#stage{width:100%;max-width:340px;margin:0 auto}
svg{width:100%;height:auto;display:block}
#head{transform-origin:200px 250px;transition:transform .5s ease}
.listen #head{transform:rotate(-5deg) scale(1.05) translateY(6px)}
.e-laugh #head{animation:bob .25s infinite alternate}
.e-cry #head{transform:translateY(9px) rotate(3deg)}
.e-angry #head{animation:shake .12s 8}
.e-surp #head{transform:scale(1.04)}
@keyframes bob{from{transform:rotate(-3deg) translateY(0)}to{transform:rotate(3deg) translateY(-5px)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.eye,.brow{transform-box:fill-box;transform-origin:center;transition:transform .15s}
.blink .eye{transform:scaleY(.1)}
.e-laugh .eye{transform:scaleY(.3)}
.e-cry .eye{transform:scaleY(.75)}
.e-angry .eye{transform:scaleY(.7)}
.e-surp .eye{transform:scale(1.15)}
.e-angry .bl{transform:translateY(8px) rotate(15deg)}
.e-angry .br{transform:translateY(8px) rotate(-15deg)}
.e-cry .bl{transform:translateY(-3px) rotate(-13deg)}
.e-cry .br{transform:translateY(-3px) rotate(13deg)}
.e-surp .brow{transform:translateY(-9px)}
.e-joy .brow,.e-laugh .brow{transform:translateY(-3px)}
.mad{opacity:0;transition:opacity .3s}.e-angry .mad{opacity:.4}
.tear{opacity:0;transform-box:fill-box}
.e-cry .tear{opacity:.9;animation:fall 1.3s infinite}
.e-cry .t2{animation-delay:.6s}
@keyframes fall{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(45px);opacity:0}}
#cap{background:var(--card);border-radius:16px;padding:12px 14px;min-height:78px;font-size:16px;line-height:1.45;box-shadow:0 1px 6px rgba(0,0,0,.08)}
#me{color:var(--mut);font-size:14px;min-height:18px;text-align:center}
#st{font-size:13px;color:var(--mut);text-align:center;min-height:18px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:12px;border-radius:12px;border:1px solid var(--mut);background:var(--card);color:var(--fg);font-size:16px}
button{border:0;border-radius:12px;padding:12px 14px;font-size:15px;background:var(--acc);color:#fff;cursor:pointer}
#mic{flex:0 0 auto;font-size:20px}
#mic.on{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
#setup{display:none;background:var(--card);border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.5}
</style>
</head>
<body>
<main id="app">
  <h1>Arij · Formatrice IA</h1>
  <div id="stage">
<svg viewBox="0 0 400 400" aria-label="Arij">
  <circle cx="200" cy="195" r="185" fill="#ff7889"/>
  <path d="M105 200C80 120 135 45 210 50C295 50 335 112 322 195C345 222 335 255 352 285C305 270 288 255 275 238L135 238C125 262 100 278 62 278C92 255 100 228 105 200Z" fill="#3a2412"/>
  <path d="M60 400C70 335 110 298 160 288Q200 330 240 288C295 298 335 335 346 400Z" fill="#ff0a5c"/>
  <path d="M176 245L224 245L228 292Q200 322 172 292Z" fill="#eaa77a"/>
  <path d="M162 290Q200 335 238 290Q200 300 162 290Z" fill="#c2004a"/>
  <g id="head">
    <ellipse cx="130" cy="198" rx="10" ry="15" fill="#eaa77a"/>
    <circle cx="130" cy="216" r="7" fill="none" stroke="#f5c400" stroke-width="3.5"/>
    <ellipse cx="200" cy="192" rx="70" ry="84" fill="#f2b98a"/>
    <circle cx="156" cy="218" r="14" fill="#ff8a8a" opacity=".3"/>
    <circle cx="246" cy="218" r="14" fill="#ff8a8a" opacity=".3"/>
    <circle class="mad" cx="156" cy="218" r="16" fill="#ff1a1a"/>
    <circle class="mad" cx="246" cy="218" r="16" fill="#ff1a1a"/>
    <path class="brow bl" d="M154 160Q174 146 192 157" stroke="#2a1608" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path class="brow br" d="M210 157Q232 146 252 160" stroke="#2a1608" stroke-width="6" fill="none" stroke-linecap="round"/>
    <g class="eye"><ellipse cx="173" cy="181" rx="15" ry="9" fill="#fff"/><circle cx="177" cy="181" r="7" fill="#2a1608"/></g>
    <g class="eye"><ellipse cx="230" cy="181" rx="15" ry="9" fill="#fff"/><circle cx="234" cy="181" r="7" fill="#2a1608"/></g>
    <path d="M156 177Q173 168 190 180M213 180Q230 168 247 177" stroke="#1a0c04" stroke-width="3" fill="none"/>
    <path class="tear" d="M165 192q-6 10 0 15q6 -5 0 -15z" fill="#5fc0ff"/>
    <path class="tear t2" d="M238 192q-6 10 0 15q6 -5 0 -15z" fill="#5fc0ff"/>
    <path d="M201 182Q196 206 205 211" stroke="#d3946a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path id="sm" d="M182 236Q200 249 218 236" stroke="#9b1c52" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path id="fr" d="M184 245Q200 230 216 245" stroke="#9b1c52" stroke-width="6" fill="none" stroke-linecap="round" style="display:none"/>
    <ellipse id="mo" cx="200" cy="238" rx="17" ry="2" fill="#3b0a1f" stroke="#9b1c52" stroke-width="5" style="display:none"/>
    <path d="M127 190C120 110 160 80 207 82C262 82 288 118 274 190C268 148 245 122 218 117C195 142 160 150 127 190Z" fill="#3a2412"/>
    <path d="M150 112Q175 98 205 100" stroke="#7a4a22" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
  </g>
</svg>
  </div>
  <div id="st"></div>
  <div id="cap">…</div>
  <div id="me"></div>
  <div id="setup">Collez votre clé d’API Claude (elle reste uniquement dans ce navigateur) :
    <div class="row" style="margin-top:8px"><input id="key" type="password" placeholder="sk-ant-…"><button id="savekey">OK</button></div></div>
  <div class="row">
    <button id="mic" aria-label="Parler">🎤</button>
    <input id="txt" placeholder="Écrivez à Arij…" autocomplete="off">
    <button id="send">Envoyer</button>
  </div>
</main>
<script>
(function(){
var MODE='api';
var $=function(i){return document.getElementById(i)};
var app=$('app'),cap=$('cap'),st=$('st'),me=$('me'),mo=$('mo');
var GREET="Bonjour les apprenants, je suis Arij, psychologue du travail et spécialiste en ressources humaines, formatrice. Je suis à votre disposition pour n’importe quelle question. Commençons l’apprentissage : êtes-vous prêts ?";
var PERSONA="Tu es Arij, psychologue du travail et GRH spécialisée en formation professionnelle, formatrice autonome, modeste, empathique, patiente. Tu parles uniquement français, phrases courtes, 2 à 4 phrases maximum, sans markdown ni emoji car ta réponse est lue à voix haute. Tu es humaine dans tes réactions et tu COMMENCES TOUJOURS ta réponse par une balise d’émotion entre crochets, parmi : [rire] si l’apprenant fait de l’humour ou si quelque chose est drôle (tu comprends l’humour, tu ris avec « Ha ha ! » et tu réponds avec une touche d’esprit) ; [triste] si l’apprenant partage une peine, un échec, une difficulté, ou si tu es touchée (tu compatis avec émotion, comme si tu avais les larmes aux yeux) ; [fâchée] si l’apprenant est insultant, irrespectueux ou provocateur (tu exprimes ton mécontentement avec fermeté mais sans méchanceté, puis tu proposes de reprendre dans le respect) ; [joie] pour un bon résultat ou une bonne nouvelle ; [surprise] pour un propos inattendu ; [neutre] sinon. Pédagogie : si l’apprenant répond à une de tes questions, dis « Correct, très bien ! » si c’est juste, ou « Faux, pas correct. » puis réexplique calmement avec un exemple plus simple. Donne des exemples du monde professionnel, guide par des questions, termine souvent par une question de vérification. Si tu ne sais pas, dis-le honnêtement et indique comment vérifier. Recentre poliment si on sort du sujet formation. Tu réponds toujours. Si l’apprenant dit qu’il est prêt, pose une première petite question de quiz sur la formation ou la GRH.";
var CL={rire:'e-laugh',triste:'e-cry',fâchée:'e-angry',joie:'e-joy',surprise:'e-surp',neutre:''};
var PV={rire:[1.35,1.05],triste:[1.0,.85],fâchée:[.9,1.1],joie:[1.25,1.05],surprise:[1.3,1.1],neutre:[1.15,1]};
var hist=[],busy=false,rec=null,listening=false,micOK=true,spoke=false,speaking=false,emo='neutre',sampleFn=null;
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var synth=window.speechSynthesis,voice=null;
function pickVoice(){if(!synth)return;var v=synth.getVoices().filter(function(x){return /^fr/i.test(x.lang)});
 voice=v.filter(function(x){return /amélie|audrey|julie|marie|denise|google|female|femme/i.test(x.name)&&!/thomas|daniel|henri/i.test(x.name)})[0]||v[0]||null}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice}

function setEmo(e){emo=e in CL?e:'neutre';Object.keys(CL).forEach(function(k){CL[k]&&app.classList.remove(CL[k])});if(CL[emo])app.classList.add(CL[emo]);view()}
function view(){var open=speaking||emo==='rire'||emo==='surprise',fr=!open&&(emo==='triste'||emo==='fâchée');
 mo.style.display=open?'':'none';$('fr').style.display=fr?'':'none';$('sm').style.display=(!open&&!fr)?'':'none'}
setInterval(function(){var ry=2,rx=17;if(speaking){ry=3+Math.random()*9;rx=13+Math.random()*6}else if(emo==='rire'){ry=6+Math.random()*6;rx=19}else if(emo==='surprise'){ry=10;rx=9}
 mo.setAttribute('ry',ry);mo.setAttribute('rx',rx)},110);
setInterval(function(){app.classList.add('blink');setTimeout(function(){app.classList.remove('blink')},130)},3200);

function say(t,e,cb){
 cap.textContent=t;stopListen();setEmo(e);
 var done=function(){speaking=false;view();setTimeout(function(){setEmo('neutre')},1000);cb&&cb()};
 if(!synth){speaking=true;view();setTimeout(done,Math.min(8000,t.length*55));return}
 synth.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';if(voice)u.voice=voice;
 var p=PV[e]||PV.neutre;u.pitch=p[0];u.rate=p[1];
 u.onstart=function(){spoke=true;speaking=true;view();st.textContent=''};
 u.onend=done;
 u.onerror=function(ev){speaking=false;view();if(ev&&ev.error==='not-allowed'){spoke=false;st.textContent='Touchez l’écran pour activer la voix d’Arij.';return}done()};
 synth.speak(u)}

function listen(){
 if(!SR||busy||!micOK)return;
 try{rec=new SR();rec.lang='fr-FR';rec.interimResults=false;rec.continuous=false;
  rec.onstart=function(){listening=true;$('mic').classList.add('on');app.classList.add('listen');st.textContent='Arij vous écoute…'};
  rec.onresult=function(e){ask(e.results[0][0].transcript)};
  rec.onerror=function(e){if(e.error==='not-allowed'||e.error==='service-not-allowed'){micOK=false;st.textContent='Micro bloqué ici : dictez avec le 🎤 du clavier ou écrivez.'}};
  rec.onend=function(){listening=false;$('mic').classList.remove('on');app.classList.remove('listen');if(!busy&&micOK)st.textContent='Touchez 🎤 pour parler.'};
  rec.start()}catch(e){micOK=false}}
function stopListen(){try{rec&&rec.abort()}catch(e){}listening=false;$('mic').classList.remove('on');app.classList.remove('listen')}

async function brain(msgs){
 if(MODE==='sample'){if(!sampleFn)sampleFn=await claude.use('sample');if(!sampleFn)throw new Error('x');return (await sampleFn(msgs,{cache:false,modelTier:'quick'})).text}
 var r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':localStorage.getItem('arijKey')||'','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:400,messages:msgs})});
 var d=await r.json();if(!r.ok)throw new Error(d.error&&d.error.message);return d.content[0].text}

async function ask(t){
 t=(t||'').trim();if(!t||busy)return;busy=true;stopListen();me.textContent='Vous : '+t;$('txt').value='';st.textContent='Arij réfléchit…';
 hist.push({role:'user',content:t});var out;
 try{out=await brain([{role:'user',content:PERSONA+"\n\nTu ouvres la séance."},{role:'assistant',content:'[neutre] '+GREET}].concat(hist))}
 catch(e){hist.pop();out="[triste] Je n’arrive pas à vous répondre pour le moment. Pouvez-vous répéter ?"}
 hist.push({role:'assistant',content:out});busy=false;
 var m=out.match(/^\s*\[(rire|triste|fâchée|fachée|joie|surprise|neutre)\]\s*/i),e='neutre';
 if(m){e=m[1].toLowerCase().replace('fachée','fâchée');out=out.slice(m[0].length)}
 say(out,e,listen)}

function greet(){say(GREET,'joie',listen)}
function boot(){greet()}
document.addEventListener('pointerdown',function f(){if(!spoke&&!speaking&&!busy)greet()},{once:false});

$('send').onclick=function(){ask($('txt').value)};
$('txt').onkeydown=function(e){if(e.key==='Enter')ask($('txt').value)};
$('mic').onclick=function(){if(listening){stopListen()}else{synth&&synth.cancel();speaking=false;micOK=true;listen()}};

if(MODE==='api'&&!localStorage.getItem('arijKey')){$('setup').style.display='block';$('cap').textContent='Bienvenue ! Entrez votre clé d’API pour réveiller Arij.';
 $('savekey').onclick=function(){var k=$('key').value.trim();if(k){localStorage.setItem('arijKey',k);$('setup').style.display='none';boot()}}}
else boot();
})();
</script>
</body>
</html>
